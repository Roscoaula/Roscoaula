<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Panel del Profesor - Rosco Aula</title> 


<style>

body{

    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#1976d2;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
   min-height:100vh;
padding:40px 0;
}

.contenedor{

   width:900px;
max-width:90%;
    background:white;
    color:#333;
    border-radius:15px;
    padding:40px;
    text-align:center;
    box-shadow:0 0 25px rgba(0,0,0,.3);

}

h1{

    color:#1976d2;

}

p{

    font-size:18px;

}

.boton{

    margin-top:25px;
    background:#1976d2;
    color:white;
    border:none;
    padding:15px 30px;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;

}

.boton:hover{

    background:#1258a7;

}
input,
textarea,
select{

    font-size:16px;
    padding:10px;
    box-sizing:border-box;

}
.rankingBoton{
    background:#f5b400;
    color:white;
    font-weight:bold;
    border-radius:12px;
    padding:15px 35px;
}

.rankingBoton:hover{
    background:#d99a00;
}
hr{

    margin:30px 0;

}
.modalFinal{
    display:none;
    position:fixed;
    left:0;
    top:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.55);
    justify-content:center;
    align-items:center;
    z-index:9999;
}

.modalContenido{
width:90%;
max-width:1400px;
max-height:90vh;
overflow-y:auto;
    background:linear-gradient(180deg,#ffffff,#f5f8ff);
    border-radius:20px;
    padding:35px;
    width:1000px;
   max-width:900px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,.30);
    border:3px solid #1b5cff;
    color:#333;
}
.tarjetaRanking{
    background:white;
    border-radius:18px;
    padding:20px;
    margin:10px;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
    display:inline-block;
    width:220px;
    vertical-align:top;
    text-align:center;
}

.tarjetaRanking b{
    font-size:20px;
    display:block;
    margin-bottom:15px;
}
.podio{
    display:flex;
    justify-content:center;
    align-items:stretch;
    gap:25px;
    margin-bottom:40px;
    flex-wrap:nowrap;
}
.tarjetaPodio{
    background:white;
    border-radius:20px;
    padding:25px;
   width:220px;
height:280px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:10px;
}

.tarjetaPodio b{
    font-size:24px;
}
</style>

</head>

<body>

<div class="contenedor">

<h1>👨‍🏫 Panel del Profesor</h1>
<button class="boton rankingBoton" onclick="verRanking()">
🏆 Ver Ranking
</button>
<h2>📚 Mis Roscos</h2>

<button class="boton" id="crearRosco">
➕ Crear nuevo rosco
</button>

<br><br>
<div id="listaRoscos">

    <p>No hay roscos creados todavía.</p>

</div>

<br>
<hr><br>

    <label><b>Nombre del Rosco</b></label>

<br><br>

<input 
id="nombreRosco"
type="text"
placeholder="Ej: Básquet FIBA 2026"
style="width:100%; height:35px;">
<br><br>
<label>Tiempo de la partida (segundos)</label>

<input type="number" id="tiempoRosco" value="240" min="30" step="30">

<br><br><br>
<label><b>Letra</b></label>

<br><br>

<select id="letra">

<option>A</option>
<option>B</option>
<option>C</option>
<option>D</option>
<option>E</option>
<option>F</option>
<option>G</option>
<option>H</option>
<option>I</option>
<option>J</option>
<option>L</option>
<option>M</option>
<option>N</option>
<option>Ñ</option>
<option>O</option>
<option>P</option>
<option>Q</option>
<option>R</option>
<option>S</option>
<option>T</option>
<option>U</option>
<option>V</option>
<option>W</option>
<option>X</option>
<option>Y</option>
<option>Z</option>

</select>

<br><br><br>

<label><b>Pregunta</b></label>

<br><br>

<textarea id="pregunta" rows="4" style="width:100%;"></textarea>

<br><br>

<label><b>Respuesta</b></label>

<br><br>

<input
id="respuesta"
type="text"
style="width:100%; height:35px;">

<br><br>

<button class="boton" id="guardarPregunta">
💾 Guardar pregunta
</button>

<button class="boton" onclick="window.location.href='index_dev.html'">
⬅ Volver al juego
</button>

</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCooVdhIs7ULdwQ8Hr1AYVDsHOD67DTmeY",
  authDomain: "roscoaula.firebaseapp.com",
  databaseURL: "https://roscoaula-default-rtdb.firebaseio.com",
  projectId: "roscoaula",
  storageBucket: "roscoaula.firebasestorage.app",
  messagingSenderId: "201917231804",
  appId: "1:201917231804:web:854fc61e6a03e3cf9416b9",
  measurementId: "G-4XDQHFE2C9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const letras = [
  "A","B","C","D","E","F","G","H","I","J","L","M","N","Ñ","O","P","Q","R","S","T","U","V","W","X","Y","Z"
];

let roscosCache = {};
let roscoActualId = null;

function crearIdRosco(nombre) {
  const base = nombre
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");

  return (base || "rosco") + "-" + Date.now().toString(36);
}

function escaparHTML(texto) {
  return String(texto ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function enlaceRosco(id) {
  return `https://abigaillacasa95.github.io/RoscoAula/index.html?rosco=${id}`;
}

function limpiarFormulario() {
  roscoActualId = null;
  document.getElementById("nombreRosco").value = "";
  document.getElementById("tiempoRosco").value = 240;
  document.getElementById("letra").value = "A";
  document.getElementById("pregunta").value = "";
  document.getElementById("respuesta").value = "";
}

function cargarLetraFormulario() {
  const letra = document.getElementById("letra").value;
  const rosco = roscosCache[roscoActualId];

  if (!rosco) {
    document.getElementById("pregunta").value = "";
    document.getElementById("respuesta").value = "";
    return;
  }

  const datos = rosco.preguntas?.[letra] || {};
  document.getElementById("pregunta").value = datos.pregunta || "";
  document.getElementById("respuesta").value = datos.respuesta || "";
  document.getElementById("tiempoRosco").value = rosco.tiempo || 240;
}

function actualizarListaRoscos() {
  const lista = document.getElementById("listaRoscos");
  const entradas = Object.entries(roscosCache);

  if (entradas.length === 0) {
    lista.innerHTML = "<p>No hay roscos creados todavía.</p>";
    return;
  }

  entradas.sort((a, b) =>
    (a[1].nombre || "").localeCompare(b[1].nombre || "", "es")
  );

  lista.innerHTML = entradas.map(([id, rosco]) => `
    <div style="
      background:#f4f6f8;
      padding:15px;
      border-radius:10px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;">

      <span>📚 ${escaparHTML(rosco.nombre || "Rosco sin nombre")}</span>

      <div>
        <button class="boton abrirRosco" data-id="${id}">Abrir</button>
        <button class="boton jugarRosco" data-id="${id}">▶️ Jugar</button>
        <button class="boton qrRosco" data-id="${id}">📷 Ver QR</button>
        <button class="boton copiarEnlace" data-id="${id}">🔗 Copiar enlace</button>
        <button class="boton duplicarRosco" data-id="${id}">📄</button>
        <button class="boton editarRosco" data-id="${id}">✏️</button>
        <button class="boton eliminarRosco" data-id="${id}">🗑️</button>
      </div>
    </div>
  `).join("");
}

db.ref("roscos").on("value", snapshot => {
  roscosCache = snapshot.val() || {};
  actualizarListaRoscos();

  if (roscoActualId && roscosCache[roscoActualId]) {
    document.getElementById("nombreRosco").value =
      roscosCache[roscoActualId].nombre || "";
    cargarLetraFormulario();
  }
}, error => {
  console.error(error);
  document.getElementById("listaRoscos").innerHTML =
    "<p>No se pudieron cargar los roscos. Revisá la conexión o las reglas de Firebase.</p>";
});

document.getElementById("crearRosco").onclick = async () => {
  const nombre = prompt("Nombre del nuevo rosco:");
  if (!nombre?.trim()) return;

  const id = crearIdRosco(nombre);

  try {
    await db.ref("roscos/" + id).set({
      nombre: nombre.trim(),
      tiempo: 240,
      preguntas: {},
      creadoEn: firebase.database.ServerValue.TIMESTAMP
    });

    roscoActualId = id;
    document.getElementById("nombreRosco").value = nombre.trim();
    document.getElementById("tiempoRosco").value = 240;
    document.getElementById("letra").value = "A";
    cargarLetraFormulario();
    alert("Rosco creado ✅ Ahora podés cargar sus preguntas.");
  } catch (error) {
    console.error(error);
    alert("No se pudo crear el rosco.");
  }
};

document.getElementById("guardarPregunta").onclick = async () => {
  if (!roscoActualId || !roscosCache[roscoActualId]) {
    alert("Primero creá o abrí un rosco.");
    return;
  }

  const letra = document.getElementById("letra").value;
  const pregunta = document.getElementById("pregunta").value.trim();
  const respuesta = document.getElementById("respuesta").value.toLowerCase().trim();
  const nombre = document.getElementById("nombreRosco").value.trim();
  const tiempo = Number(document.getElementById("tiempoRosco").value) || 240;

  if (!pregunta || !respuesta) {
    alert("Completá la pregunta y la respuesta.");
    return;
  }

  try {
    await db.ref("roscos/" + roscoActualId).update({
      nombre: nombre || roscosCache[roscoActualId].nombre,
      tiempo
    });

    await db.ref(`roscos/${roscoActualId}/preguntas/${letra}`).set({
      pregunta,
      respuesta
    });

    alert("✅ Pregunta guardada online");
  } catch (error) {
    console.error(error);
    alert("No se pudo guardar la pregunta.");
  }
};

document.getElementById("letra").onchange = cargarLetraFormulario;

document.addEventListener("click", async e => {
  const id = e.target.dataset.id;
  if (!id) return;

  if (e.target.classList.contains("abrirRosco")) {
    roscoActualId = id;
    document.getElementById("nombreRosco").value = roscosCache[id].nombre || "";
    document.getElementById("letra").value = "A";
    cargarLetraFormulario();
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
  }

  if (e.target.classList.contains("jugarRosco")) {
    window.open(enlaceRosco(id), "_blank");
  }

  if (e.target.classList.contains("copiarEnlace")) {
    try {
      await navigator.clipboard.writeText(enlaceRosco(id));
      alert("Enlace copiado ✅");
    } catch {
      prompt("Copiá este enlace:", enlaceRosco(id));
    }
  }

  if (e.target.classList.contains("qrRosco")) {
    mostrarQR(id);
  }

  if (e.target.classList.contains("eliminarRosco")) {
    const nombre = roscosCache[id].nombre || "este rosco";
    if (!confirm(`¿Eliminar el rosco "${nombre}" y sus resultados?`)) return;

    try {
      await Promise.all([
        db.ref("roscos/" + id).remove(),
        db.ref("resultados/" + id).remove()
      ]);
      if (roscoActualId === id) limpiarFormulario();
    } catch (error) {
      console.error(error);
      alert("No se pudo eliminar el rosco.");
    }
  }

  if (e.target.classList.contains("editarRosco")) {
    const nombreViejo = roscosCache[id].nombre || "";
    const nombreNuevo = prompt("Nuevo nombre del rosco:", nombreViejo);
    if (!nombreNuevo?.trim() || nombreNuevo.trim() === nombreViejo) return;

    try {
      await db.ref("roscos/" + id + "/nombre").set(nombreNuevo.trim());
    } catch (error) {
      console.error(error);
      alert("No se pudo cambiar el nombre.");
    }
  }

  if (e.target.classList.contains("duplicarRosco")) {
    const original = roscosCache[id];
    const nuevoNombre = (original.nombre || "Rosco") + " (Copia)";
    const nuevoId = crearIdRosco(nuevoNombre);

    try {
      await db.ref("roscos/" + nuevoId).set({
        ...original,
        nombre: nuevoNombre,
        creadoEn: firebase.database.ServerValue.TIMESTAMP
      });
      alert("Rosco duplicado ✅");
    } catch (error) {
      console.error(error);
      alert("No se pudo duplicar el rosco.");
    }
  }
});

function mostrarQR(id) {
  const rosco = roscosCache[id];
  const enlace = enlaceRosco(id);

  document.getElementById("tituloQR").innerText =
    "QR de " + (rosco.nombre || "Rosco");
  document.getElementById("enlaceQR").value = enlace;

  const contenedorQR = document.getElementById("codigoQR");
  contenedorQR.innerHTML = "";

  new QRCode(contenedorQR, {
    text: enlace,
    width: 280,
    height: 280,
    correctLevel: QRCode.CorrectLevel.H
  });

  document.getElementById("modalQR").style.display = "flex";
}

async function copiarEnlaceQR() {
  const enlace = document.getElementById("enlaceQR").value;
  try {
    await navigator.clipboard.writeText(enlace);
    alert("Enlace copiado ✅");
  } catch {
    prompt("Copiá este enlace:", enlace);
  }
}

function verRanking() {
  const entradas = Object.entries(roscosCache);

  document.getElementById("listaRoscosRanking").innerHTML =
    entradas.length === 0
      ? "<p>No hay roscos creados todavía.</p>"
      : entradas
          .sort((a, b) => (a[1].nombre || "").localeCompare(b[1].nombre || "", "es"))
          .map(([id, rosco]) =>
            `<button class="boton" onclick="mostrarRanking('${id}')">
              ${escaparHTML(rosco.nombre || "Rosco")}
            </button>`
          ).join(" ");

  document.getElementById("contenidoRanking").innerHTML = "";
  document.getElementById("modalRanking").style.display = "flex";
}

async function mostrarRanking(id) {
  const contenido = document.getElementById("contenidoRanking");
  contenido.innerHTML = "<p>Cargando ranking...</p>";

  try {
    const snapshot = await db.ref("resultados/" + id).once("value");
    const datos = snapshot.val() || {};
    const ranking = Object.values(datos);

    if (ranking.length === 0) {
      contenido.innerHTML = "<p>No hay resultados para este rosco.</p>";
      return;
    }

    ranking.sort((a, b) => {
      if (Number(b.correctas) !== Number(a.correctas)) {
        return Number(b.correctas) - Number(a.correctas);
      }
      return Number(b.tiempoRestanteSegundos || 0) -
             Number(a.tiempoRestanteSegundos || 0);
    });

    const primeros = ranking.slice(0, 3);
    const restantes = ranking.slice(3);

    let html = `<h3>${escaparHTML(roscosCache[id]?.nombre || "Rosco")}</h3>`;
    html += `<div class="podio">`;

    primeros.forEach((r, i) => {
      const puesto = i === 0 ? "🥇 PRIMER PUESTO" :
                     i === 1 ? "🥈 SEGUNDO PUESTO" :
                               "🥉 TERCER PUESTO";

      html += `
        <div class="tarjetaPodio">
          <b>${puesto}</b>
          <h3>${escaparHTML(r.nombre)}</h3>
          🟢 Correctas: ${r.correctas}<br>
          🔴 Incorrectas: ${r.incorrectas}<br>
          🟡 Pasapalabras: ${r.pasapalabras}<br>
          ⏱️ Tiempo: ${r.tiempo}
        </div>`;
    });

    html += `</div>`;

    restantes.forEach((r, i) => {
      html += `
        <div class="tarjetaRanking">
          <b>${i + 4}° ${escaparHTML(r.nombre)}</b><br>
          🟢 Correctas: ${r.correctas}<br>
          🔴 Incorrectas: ${r.incorrectas}<br>
          🟡 Pasapalabras: ${r.pasapalabras}<br>
          ⏱️ Tiempo: ${r.tiempo}
        </div>`;
    });

    contenido.innerHTML = html;
  } catch (error) {
    console.error(error);
    contenido.innerHTML =
      "<p>No se pudo cargar el ranking. Revisá la conexión o las reglas de Firebase.</p>";
  }
}
</script>

<div id="modalRanking" class="modalFinal">
  <div class="modalContenido">
    <h2>🏆 Ranking de jugadores</h2>
    <div id="listaRoscosRanking" style="margin-bottom:20px;"></div>
    <div id="contenidoRanking"></div>
    <button class="boton" onclick="document.getElementById('modalRanking').style.display='none'">
      Cerrar
    </button>
  </div>
</div>

<div id="modalQR" class="modalFinal">
  <div class="modalContenido" style="max-width:520px;">
    <h2 id="tituloQR">QR del rosco</h2>
    <div id="codigoQR" style="display:flex;justify-content:center;margin:20px 0;"></div>
    <input id="enlaceQR" type="text" readonly style="width:100%;">
    <br>
    <button class="boton" onclick="copiarEnlaceQR()">🔗 Copiar enlace</button>
    <button class="boton" onclick="document.getElementById('modalQR').style.display='none'">
      Cerrar
    </button>
  </div>
</div>

</body>
</html>
