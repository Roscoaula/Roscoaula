<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rosco Aula</title>

<style>
:root{
  --azul-fondo:#062c73;
  --azul-boton:#1976d2;
  --azul-boton-hover:#2196f3;
  --naranja:#f39c12;
  --letra-size:52px;
}

*{ box-sizing:border-box; }

html,body{ margin:0; min-height:100%; }

body{
  background:var(--azul-fondo);
  color:white;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
  min-height:100svh;
  overflow:auto;
}

.game-shell{
  position:relative;
  width:650px;
  height:650px;
  flex:0 0 auto;
}

.game-header{
  position:absolute;
  z-index:3;
  left:50%;
  top:19%;
  transform:translateX(-50%);
  text-align:center;
  pointer-events:none;
}

.game-title{
  margin:0;
  font-size:52px;
  line-height:1;
  letter-spacing:.5px;
}

.temporizador{
  display:inline-block;
  background:white;
  color:var(--azul-fondo);
  padding:8px 18px;
  border-radius:25px;
  font-size:28px;
  font-weight:bold;
  margin-top:15px;
}

.rosco{
  position:absolute;
  inset:0;
  width:650px;
  height:650px;
}

.letra{
  position:absolute;
  width:var(--letra-size);
  height:var(--letra-size);
  border-radius:50%;
  background:var(--azul-boton);
  border:3px solid white;
  color:white;
  font-weight:bold;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:default;
  transition:.25s;
  user-select:none;
  z-index:2;
}

.activa{
  transform:scale(1.22);
  box-shadow:0 0 18px white;
  border:4px solid white;
  z-index:4;
}

.letra.correcta{ background:#27ae60; }
.letra.incorrecta{ background:#d63031; }
.letra.pasada{ background:#f1c40f; color:black; }

.centro{
  position:absolute;
  left:50%;
  top:58%;
  transform:translate(-50%,-50%);
  width:340px;
  text-align:center;
  color:white;
  z-index:1;
}

.centro h2{
  margin:0 0 10px;
  font-size:24px;
}

.pregunta{
  width:320px;
  margin:0 auto 16px;
  line-height:1.35;
  min-height:44px;
  display:flex;
  justify-content:center;
  align-items:center;
}

input{
  width:280px;
  padding:12px;
  border-radius:10px;
  border:1px solid transparent;
  font-size:18px;
  text-align:center;
}

input:focus{
  outline:none;
  border-color:#70b7ff;
  box-shadow:0 0 0 3px rgba(112,183,255,.2);
}

.boton{
  margin:7px 4px;
  padding:12px 20px;
  border:none;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  background:var(--azul-boton);
  color:white;
}

.boton:hover{ background:var(--azul-boton-hover); }
.boton:disabled{ opacity:.45; cursor:not-allowed; }
.paso{ background:var(--naranja); }
.paso:hover{ background:#f5b041; }
.oculto{ display:none !important; }

.modalFinal{
  display:none;
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,.55);
  justify-content:center;
  align-items:center;
  z-index:9999;
  padding:18px;
}

.modalContenido{
  background:linear-gradient(180deg,#ffffff,#f5f8ff);
  border-radius:20px;
  padding:35px;
  width:480px;
  max-width:100%;
  max-height:92svh;
  overflow:auto;
  text-align:center;
  box-shadow:0 15px 40px rgba(0,0,0,.30);
  border:3px solid #1b5cff;
  animation:aparecer .25s ease;
  color:#222;
}

@keyframes aparecer{
  from{ transform:scale(.85); opacity:0; }
  to{ transform:scale(1); opacity:1; }
}

.modalContenido h2{
  margin:0 0 25px;
  font-size:34px;
  color:#1b5cff;
}

.modalContenido button{
  margin-top:25px;
  padding:12px 30px;
  border:none;
  border-radius:10px;
  background:#1b5cff;
  color:white;
  font-size:17px;
  cursor:pointer;
}

.modalContenido button:hover{ background:#1148d1; }
#resultadoFinal p{ font-size:20px; margin:12px 0; }

/* Vista exclusiva para celulares */
@media (max-width:768px){
  :root{ --letra-size:34px; }

  body{
    align-items:center;
    padding:12px 0;
    overflow-x:hidden;
  }

  .game-shell{
    width:100vw;
    height:auto;
    min-height:calc(100svh - 24px);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    gap:12px;
  }

  .game-header{
    position:relative;
    left:auto;
    top:auto;
    transform:none;
    width:100%;
    flex:0 0 auto;
  }

  .game-title{
    font-size:38px;
    line-height:1;
  }

  .temporizador{
    margin-top:10px;
    padding:6px 16px;
    border-radius:18px;
    font-size:23px;
  }

  .rosco{
    position:relative;
    inset:auto;
    width:min(94vw, 420px);
    height:min(94vw, 420px);
    flex:0 0 auto;
  }

  .letra{
    font-size:14px;
    border-width:2px;
  }

  .activa{
    transform:scale(1.17);
    border-width:3px;
    box-shadow:0 0 12px white;
  }

  .centro{
    top:50%;
    width:62%;
    max-width:255px;
  }

  .centro h2{
    font-size:20px;
    margin-bottom:6px;
  }

  .pregunta{
    width:100%;
    min-height:34px;
    max-height:58px;
    overflow:auto;
    margin:0 auto 8px;
    font-size:14px;
    line-height:1.22;
  }

  input{
    width:100%;
    height:42px;
    padding:8px 10px;
    font-size:15px;
    border-radius:10px;
  }

  #zonaJuego br{ display:none; }

  .boton{
    display:block;
    width:100%;
    min-height:42px;
    margin:7px 0 0;
    padding:8px 10px;
    font-size:16px;
    border-radius:10px;
  }

  .modalContenido{
    padding:24px 18px;
    border-radius:16px;
  }

  .modalContenido h2{ font-size:27px; }
  #resultadoFinal p{ font-size:17px; }
}

@media (max-width:380px), (max-height:700px) and (max-width:768px){
  :root{ --letra-size:31px; }
  body{ padding:6px 0; }
  .game-shell{ min-height:calc(100svh - 12px); gap:7px; }
  .game-title{ font-size:32px; }
  .temporizador{ margin-top:6px; font-size:20px; padding:5px 13px; }
  .rosco{ width:min(91vw, 360px); height:min(91vw, 360px); }
  .centro{ width:61%; }
  .centro h2{ font-size:18px; }
  .pregunta{ font-size:13px; max-height:48px; }
  input{ height:38px; font-size:14px; }
  .boton{ min-height:38px; font-size:14px; margin-top:5px; }
}

.modalMensaje{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:10000;padding:18px}.modalMensaje .caja{background:#fff;color:#222;border-radius:16px;padding:24px;max-width:340px;width:90%;text-align:center;border:3px solid #1b5cff}.modalMensaje h3{margin:0 0 10px;color:#1b5cff}
</style>

</head>

<body>

<main class="game-shell">
  <header class="game-header">
    <h1 class="game-title">ROSCO</h1>
    <div class="temporizador">04:00</div>
  </header>

  <div class="rosco">
    <div class="centro">
      <div id="zonaJuego">
        <h2 id="tituloPregunta">Preparando rosco...</h2>

        <p class="pregunta" id="textoPregunta">Cargando preguntas...</p>

        <input id="respuestaJugador" type="text" placeholder="Escribí tu respuesta" disabled>

        <button class="boton" id="comenzar" disabled>Comenzar partida</button>
        <button class="boton oculto" id="responder" disabled>Responder</button>
        <button class="boton paso oculto" id="pasapalabra" disabled>Pasapalabra</button>
      </div>

      <div id="resultado" style="display:none; margin-top:20px;"></div>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCooVdhIs7ULdwQ8Hr1AYVDsHOD67DTmeY",
  authDomain: "roscoaula.firebaseapp.com",
  databaseURL: "https://roscoaula-default-rtdb.firebaseio.com",
  projectId: "roscoaula",
  storageBucket: "roscoaula.firebasestorage.app",
  messagingSenderId: "201917231804",
  appId: "1:201917231804:web:854fc61e6a03e3cf9416b9",
  measurementId: "G-4XDQHFE2C9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const letras = [
  "A","B","C","D","E","F","G","H","I","J","L","M","N","Ñ","O","P","Q","R","S","T","U","V","W","X","Y","Z"
];

const rosco = document.querySelector(".rosco");
const temporizador = document.querySelector(".temporizador");
const inputRespuesta = document.getElementById("respuestaJugador");
const botonComenzar = document.getElementById("comenzar");
const botonResponder = document.getElementById("responder");
const botonPasapalabra = document.getElementById("pasapalabra");

const params = new URLSearchParams(window.location.search);
const roscoId = params.get("rosco");

let roscoElegido = "";
let preguntas = {};
let respuestas = {};
let tiempo = 240;
let intervalo;
let letraActual = "A";
let posicionActual = 0;
let letrasPendientes = [];
let segundaVuelta = false;
let indicePendiente = 0;
let correctas = 0;
let incorrectas = 0;
let partidaFinalizada = false;
let resultadoGuardado = false;
const estadosLetras = {};

function mostrarError(mensaje) {
  document.getElementById("tituloPregunta").innerText = "Rosco no disponible";
  document.getElementById("textoPregunta").innerText = mensaje;
  botonComenzar.disabled = true;
  botonResponder.disabled = true;
  botonPasapalabra.disabled = true;
  inputRespuesta.disabled = true;
}

function crearCirculos() {
  document.querySelectorAll(".letra").forEach(el => el.remove());

  const tamano = rosco.clientWidth;
  const centro = tamano / 2;
  const radio = tamano * 0.42;

  letras.forEach((letra, i) => {
    const div = document.createElement("div");
    div.className = "letra";
    div.innerText = letra;
    div.style.pointerEvents = "none";

    if (estadosLetras[letra] === "correcta") {
      div.style.background = "#27ae60";
      div.style.color = "white";
    } else if (estadosLetras[letra] === "incorrecta") {
      div.style.background = "#d63031";
      div.style.color = "white";
    } else if (estadosLetras[letra] === "pasada") {
      div.style.background = "#f1c40f";
      div.style.color = "black";
    }

    rosco.appendChild(div);

    const angulo = (2 * Math.PI / letras.length) * i - Math.PI / 2;
    const tamanoLetra = div.offsetWidth;

    div.style.left =
      (centro + radio * Math.cos(angulo) - tamanoLetra / 2) + "px";

    div.style.top =
      (centro + radio * Math.sin(angulo) - tamanoLetra / 2) + "px";
  });
}

function actualizarTemporizador() {
  const minutos = Math.floor(tiempo / 60);
  const segundos = tiempo % 60;
  temporizador.innerText =
    String(minutos).padStart(2, "0") + ":" +
    String(segundos).padStart(2, "0");
}

function mostrarLetra(letra) {
  document.querySelectorAll(".letra").forEach(l => l.classList.remove("activa"));

  document.querySelectorAll(".letra").forEach(l => {
    if (l.innerText === letra) l.classList.add("activa");
  });

  document.getElementById("tituloPregunta").innerText = "Con la " + letra + "...";
  document.getElementById("textoPregunta").innerText =
    preguntas[letra]?.pregunta || "No hay pregunta cargada para esta letra.";

  letraActual = letra;
  posicionActual = letras.indexOf(letra);
  inputRespuesta.value = "";
  inputRespuesta.focus();
}

function iniciarTemporizador() {
  intervalo = setInterval(() => {
    tiempo--;
    actualizarTemporizador();

    if (tiempo <= 0) {
      clearInterval(intervalo);
      finalizarPartida();
    }
  }, 1000);
}

function finalizarPartida() {
  if (partidaFinalizada) return;
  partidaFinalizada = true;

  clearInterval(intervalo);
  inputRespuesta.disabled = true;
  botonResponder.disabled = true;
  botonPasapalabra.disabled = true;

  document.getElementById("resultadoFinal").innerHTML = `
    <h3 style="
      font-size:32px;
      color:#062c73;
      margin:5px 0 25px 0;
      text-transform:uppercase;
      letter-spacing:1px;">
      🏆 ${roscoElegido}
    </h3>

    <input
      id="nombreJugador"
      type="text"
      placeholder="Escribí tu nombre"
      style="
        width:80%;
        padding:12px;
        font-size:18px;
        border-radius:10px;
        border:2px solid #1b5cff;
        margin-bottom:20px;
        text-align:center;">

    <br>
    <button class="boton" id="botonGuardarResultado">
      💾 Guardar resultado
    </button>

    <p>🟢 <strong>Correctas:</strong> ${correctas}</p>
    <p>🔴 <strong>Incorrectas:</strong> ${incorrectas}</p>
    <p>🟡 <strong>Pasapalabras:</strong> ${letrasPendientes.length}</p>
    <p>⏱️ <strong>Tiempo restante:</strong> ${temporizador.innerText}</p>
    <br>
    <button class="boton" onclick="location.reload()">🔄 Jugar otra vez</button>
  `;

  document.getElementById("modalFinal").style.display = "flex";
  document.getElementById("botonGuardarResultado").onclick = guardarResultado;
  setTimeout(() => document.getElementById("nombreJugador").focus(), 100);
}

function siguienteLetra() {
  if (segundaVuelta) {
    if (indicePendiente < letrasPendientes.length) {
      mostrarLetra(letrasPendientes[indicePendiente]);
      indicePendiente++;
      return;
    }
    finalizarPartida();
    return;
  }

  posicionActual++;

  if (posicionActual >= letras.length) {
    posicionActual = 0;

    if (letrasPendientes.length > 0) {
      segundaVuelta = true;
      indicePendiente = 0;
      mostrarLetra(letrasPendientes[indicePendiente]);
      indicePendiente++;
      return;
    }

    finalizarPartida();
    return;
  }

  mostrarLetra(letras[posicionActual]);
}

async function guardarResultado() {
  if (resultadoGuardado) return;

  const nombreInput = document.getElementById("nombreJugador");
  const nombre = nombreInput.value.trim();

  if (!nombre) {
    mostrarMensaje("Falta un dato","Escribí tu nombre para guardar el resultado.");
    nombreInput.focus();
    return;
  }

  const boton = document.getElementById("botonGuardarResultado");
  boton.disabled = true;
  boton.innerText = "Guardando...";

  const resultado = {
    nombre,
    roscoId,
    rosco: roscoElegido,
    correctas,
    incorrectas,
    pasapalabras: letrasPendientes.length,
    tiempo: temporizador.innerText,
    tiempoRestanteSegundos: tiempo,
    fecha: firebase.database.ServerValue.TIMESTAMP
  };

  try {
    await db.ref("resultados/" + roscoId).push(resultado);
    resultadoGuardado = true;
    boton.innerText = "✅ Resultado guardado";
    nombreInput.disabled = true;
    mostrarMensaje("Resultado guardado","Tu resultado ya forma parte del ranking.");
  } catch (error) {
    console.error(error);
    boton.disabled = false;
    boton.innerText = "💾 Guardar resultado";
    mostrarMensaje("Error","No se pudo guardar el resultado. Intentá nuevamente.");
  }
}

async function cargarRosco() {
  crearCirculos();

  if (!roscoId) {
    mostrarError("Escaneá el QR que te dio el profesor para entrar al rosco correcto.");
    return;
  }

  try {
    const snapshot = await db.ref("roscos/" + roscoId).once("value");

    if (!snapshot.exists()) {
      mostrarError("Este QR no corresponde a un rosco disponible.");
      return;
    }

    const datos = snapshot.val();
    roscoElegido = datos.nombre || "Rosco";
    tiempo = Number(datos.tiempo) || 240;
    preguntas = datos.preguntas || {};

    letras.forEach(letra => {
      respuestas[letra] = (preguntas[letra]?.respuesta || "").toLowerCase().trim();
    });

    actualizarTemporizador();
    mostrarLetra("A");

    botonComenzar.disabled = false;
    inputRespuesta.disabled = true;
  } catch (error) {
    console.error(error);
    mostrarError("No se pudo cargar el rosco. Revisá la conexión e intentá nuevamente.");
  }
}

botonComenzar.onclick = () => {
  botonComenzar.disabled = true;
  botonComenzar.classList.add("oculto");
  botonResponder.classList.remove("oculto");
  botonPasapalabra.classList.remove("oculto");
  botonResponder.disabled = false;
  botonPasapalabra.disabled = false;
  inputRespuesta.disabled = false;
  mostrarLetra("A");
  iniciarTemporizador();
};

botonResponder.onclick = () => {
  const respuesta = inputRespuesta.value.toLowerCase().trim();

  if (!respuesta) {
    mostrarMensaje("Respuesta vacía","Escribí una respuesta para continuar.");
    inputRespuesta.focus();
    return;
  }

  const letraRespondida = letraActual;
  const circulo = [...document.querySelectorAll(".letra")]
    .find(l => l.innerText === letraRespondida);

  letrasPendientes = letrasPendientes.filter(l => l !== letraRespondida);

  circulo.classList.remove("correcta", "incorrecta", "pasada");

  if (respuesta === respuestas[letraRespondida]) {
    correctas++;
    estadosLetras[letraRespondida] = "correcta";
    circulo.style.background = "#27ae60";
    circulo.style.color = "white";
  } else {
    incorrectas++;
    estadosLetras[letraRespondida] = "incorrecta";
    circulo.style.background = "#d63031";
    circulo.style.color = "white";
  }

  inputRespuesta.value = "";
  siguienteLetra();
};

inputRespuesta.addEventListener("keydown", e => {
  if (e.key === "Enter" && !botonResponder.disabled) botonResponder.click();
});

botonPasapalabra.onclick = () => {
  const letraPasada = letraActual;

  if (!letrasPendientes.includes(letraPasada)) {
    letrasPendientes.push(letraPasada);
  }

  const circulo = [...document.querySelectorAll(".letra")]
    .find(l => l.innerText === letraPasada);

  estadosLetras[letraPasada] = "pasada";
  circulo.classList.remove("correcta", "incorrecta");
  circulo.style.background = "#f1c40f";
  circulo.style.color = "black";

  inputRespuesta.value = "";
  siguienteLetra();
};

let resizeRoscoTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeRoscoTimer);
  resizeRoscoTimer = setTimeout(() => {
    crearCirculos();
    mostrarLetra(letraActual);
  }, 120);
});

function mostrarMensaje(titulo,texto){document.getElementById('tituloMensaje').innerText=titulo;document.getElementById('textoMensaje').innerText=texto;document.getElementById('modalMensaje').style.display='flex';}
function cerrarMensaje(){document.getElementById('modalMensaje').style.display='none';}

cargarRosco();
</script>

<div id="modalFinal" class="modalFinal">
  <div class="modalContenido">
    <h2>🏆 Partida finalizada</h2>
    <p id="resultadoFinal"></p>
  </div>
</div>
<div id="modalMensaje" class="modalMensaje"><div class="caja"><h3 id="tituloMensaje"></h3><p id="textoMensaje"></p><button class="boton" onclick="cerrarMensaje()">Aceptar</button></div></div>
</body>
</html>
